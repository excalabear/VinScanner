plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

android {

    def keystorePropsFile = rootProject.file("app/keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    signingConfigs {
        release {
            storeFile file(keystoreProps['storeFile'] ?: 'vin_scanner_release.keystore')
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
    }

    namespace 'com.example.vinscanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.vinscanner"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // ✅ FIX JVM TARGET MISMATCH
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "com.google.android.material:material:1.12.0"

    implementation "androidx.camera:camera-core:1.3.0"
    implementation "androidx.camera:camera-camera2:1.3.0"
    implementation "androidx.camera:camera-lifecycle:1.3.0"
    implementation "androidx.camera:camera-view:1.3.0"

    // ✅ ADD this single, modern dependency for barcode scanning
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.0'

    // EncryptedSharedPreferences for secure credential storage (optional)
    implementation "androidx.security:security-crypto:1.1.0-alpha03"
}
